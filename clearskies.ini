; Clear Skies: a mod for Savage Wind that adds Cemu's Clarity presets.
; The launcher changes 'preset' for you. Changes here take effect the next time the game starts.

[clarity]
preset = serfrost

; Presets (Cemu's Clarity graphic pack, CC0 1.0; each by its named creator):
;   off                  the game's own look
;   serfrost             Serfrost's Preset (Recommended)
;   serfrost_dim         Serfrost's Preset (Dim Display)
;   serfrost_bright      Serfrost's Preset (Bright Display)
;   bruz                 Bruz's Preset
;   cellhunter           CellHunter's Preset
;   jamie                Jamie's Preset
;   t3nka                t3nka Neutral+
;   complaining_gamer    The Complaining Gamer's Preset
;   viskclarity          ViskClarity Preset
;   contrasty            Contrasty Preset
;   filmic               Filmic Preset
;   sotw_warmer          Silentverge's Survival of the Wild Preset (Warmer)
;   sotw_colder          Silentverge's Survival of the Wild Preset (Colder)
;   godot_mexican        Godot's Mexican Preset
;   hexaae_clear         Hexaae's Clear Preset
;   maranbr              MaranBr Preset (Little More Intense)
;   yemaowuxin_bright    YeMaoWuXin's Preset (Bright colors)
;   yemaowuxin_vivid     YeMaoWuXin's Preset (Vivid and clear)
;   cobalt               Cobalt's Preset (Saturated & Bright)
;   custom               User-Defined Preset

; Any setting below changes the chosen preset. Remove the ; in front of a line to use it.
; The values shown are Serfrost's preset. Switches are 1 (on) or 0 (off).
; Tone_map: -1 none (clamp), 0 BotW, 1 Reshade, 2 linear, 3 Reinhard, 4 luma Reinhard,
;           5 white-preserving Reinhard, 6 RomBinDaHouse, 7 filmic, 8 Uncharted 2, 9 ACES
; adjust_bloom = 1                     ; switch
; bloomFactor = 0.3                    ; number
; HDRpassing = 1                       ; switch
; HDRPower = 1.15                      ; number
; radius1 = 0.793                      ; number
; radius2 = 0.87                       ; number
; lumapassing = 1                      ; switch
; sharp_strength = 0.45                ; number
; sharp_clamp = 0.085                  ; number
; offset_bias = 1                      ; number
; Tone_map = 8                         ; switch
; Exposure = 1.1                       ; number
; Bleach = 0.1                         ; number
; Gamma = 1                            ; number
; defog = 0                            ; number
; FogColor = 1, 1, 1                   ; colour: three numbers
; sat = 0                              ; number
; crushContrast = 0                    ; number
; post_process = 0                     ; switch
; satFactor = 0.07                     ; number
; blacknwhitepass = 1                  ; switch
; BlackPoint = 5                       ; whole number
; WhitePoint = 210                     ; whole number
; lggpass = 1                          ; switch
; RGB_Lift = 1.027, 1.027, 1.027       ; colour: three numbers
; RGB_Gamma = 0.83, 0.83, 0.83         ; colour: three numbers
; RGB_Gain = 1.1, 1.1, 1.1             ; colour: three numbers
; vibpass = 1                          ; switch
; Vibrance = 0.45                      ; number
; VibranceRGBBalance = 1, 1, 1.3       ; colour: three numbers
; Tech = 1                             ; switch
; Power = 6                            ; number
; RGBNegativeAmount = 0.88, 0.88, 0.88 ; colour: three numbers
; Strength = 0.3                       ; number
; Techine = 1                          ; switch
; Technicolor2_Red_Strength = -0.12    ; number
; Technicolor2_Green_Strength = -0.25  ; number
; Technicolor2_Blue_Strength = -0.15   ; number
; Technicolor2_Brightness = 0.4        ; number
; Technicolor2_Strength = 1            ; number
; Technicolor2_Saturation = 0.9        ; number
; cmatrix = 0                          ; switch
; ColorMatrix_Red = 0.817, 0.183, 0    ; colour: three numbers
; ColorMatrix_Green = 0.333, 0.667, 0  ; colour: three numbers
; ColorMatrix_Blue = 0, 0.125, 0.875   ; colour: three numbers
; CM_Strength = 1                      ; number
; CurvesPss = 0                        ; switch
; Contrast = 0.5                       ; number
; Filmicpass = 1                       ; switch
; Filmic_Contrast = 1.03               ; number
; Filmic_Bleach = 0                    ; number
; Saturation = -0.35                   ; number
; Filmic_Strength = 0.6                ; number
; Fade = 0.1                           ; number
; Linearization = 1                    ; number
; BaseCurve = 1.5                      ; number
; BaseGamma = 1                        ; number
; EffectGamma = 0.68                   ; number
; dpxpass = 0                          ; switch
; RGB_Curve = 8, 8, 8                  ; colour: three numbers
; RGB_C = 0.36, 0.36, 0.34             ; colour: three numbers
; DPX_Contrast = 0.1                   ; number
; DPX_Saturation = 3                   ; number
; Colorfulness = 1                     ; number
; DPX_Strength = 0.2                   ; number

[launcher]
game = 
